<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip & Bill Splitter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>💸 Tip & Bill Splitter</h1>
    
    <!-- Bill Input -->
    <div class="input-group">
      <label for="bill">Bill Amount ($)</label>
      <input type="number" id="bill" step="0.01" placeholder="0.00">
    </div>

    <!-- Tip Selection -->
    <div class="input-group">
      <label>Select Tip %</label>
      <div class="tip-buttons">
        <button type="button" class="tip-btn" data-tip="5">5%</button>
        <button type="button" class="tip-btn" data-tip="10">10%</button>
        <button type="button" class="tip-btn active" data-tip="15">15%</button>
        <button type="button" class="tip-btn" data-tip="20">20%</button>
        <input type="number" id="custom-tip" placeholder="Custom">
      </div>
    </div>

    <!-- Number of People -->
    <div class="input-group">
      <label for="people">Number of People</label>
      <input type="number" id="people" min="1" value="1">
    </div>

    <!-- Result Display Section -->
    <div class="results">
      <div class="result-box">
        <span>Tip Amount</span>
        <h2 id="tip-amount">$0.00</h2>
      </div>
      <div class="result-box">
        <span>Total Per Person</span>
        <h2 id="total-per-person">$0.00</h2>
      </div>
    </div>

    <button id="reset-btn">Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
